name: Encrypted Supabase backup

on:
  schedule:
    - cron: "23 3 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "supabase-backup"
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backup secrets
        shell: bash
        run: bash scripts/backup-preflight.sh

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set backup paths
        id: backup
        shell: bash
        run: |
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/supabase-backup-$stamp" >> "$GITHUB_OUTPUT"
          echo "archive=$RUNNER_TEMP/supabase-backup-$stamp.tar.gz" >> "$GITHUB_OUTPUT"
          echo "verified=$RUNNER_TEMP/supabase-backup-$stamp.verified.tar.gz" >> "$GITHUB_OUTPUT"
          echo "encrypted=$RUNNER_TEMP/supabase-backup-$stamp.tar.gz.gpg" >> "$GITHUB_OUTPUT"

      - name: Create logical dumps
        shell: bash
        run: |
          mkdir -p "${{ steps.backup.outputs.dir }}"
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "${{ steps.backup.outputs.dir }}/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "${{ steps.backup.outputs.dir }}/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "${{ steps.backup.outputs.dir }}/data.sql" --use-copy --data-only
          printf '{"createdAt":"%s","source":"conan-card-tracker","scope":"complete-logical-dump"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "${{ steps.backup.outputs.dir }}/manifest.json"

      - name: Validate dump contents
        shell: bash
        run: |
          test -s "${{ steps.backup.outputs.dir }}/roles.sql"
          test -s "${{ steps.backup.outputs.dir }}/schema.sql"
          test -s "${{ steps.backup.outputs.dir }}/data.sql"
          grep -q "app_states" "${{ steps.backup.outputs.dir }}/data.sql"
          grep -q "auth" "${{ steps.backup.outputs.dir }}/data.sql"
          grep -q "users" "${{ steps.backup.outputs.dir }}/data.sql"

      - name: Encrypt backup
        shell: bash
        run: |
          tar -C "${{ steps.backup.outputs.dir }}" -czf "${{ steps.backup.outputs.archive }}" .
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg \
            --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "${{ steps.backup.outputs.encrypted }}" \
            "${{ steps.backup.outputs.archive }}"

      - name: Verify encrypted archive
        shell: bash
        run: |
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg \
            --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --output "${{ steps.backup.outputs.verified }}" \
            --decrypt "${{ steps.backup.outputs.encrypted }}"
          cmp -- "${{ steps.backup.outputs.archive }}" "${{ steps.backup.outputs.verified }}"
          tar -tzf "${{ steps.backup.outputs.verified }}" > "${{ steps.backup.outputs.dir }}/contents.txt"
          for file in roles.sql schema.sql data.sql manifest.json; do
            grep -Fx "./$file" "${{ steps.backup.outputs.dir }}/contents.txt"
          done

      - name: Upload encrypted backup
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.backup.outputs.stamp }}
          path: ${{ steps.backup.outputs.encrypted }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Backup result
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success ]]; then
            printf '## Backup created\n\nEncrypted archive uploaded (30-day retention). Full decryption matched the original archive. This does not replace an isolated database restore drill.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\n## Backup incomplete\n\nNo successful backup upload was confirmed for this run. Check the failed step above; do not treat this run as a recovery point.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean temporary backup files
        if: always()
        shell: bash
        env:
          BACKUP_DIR: ${{ steps.backup.outputs.dir }}
          ARCHIVE: ${{ steps.backup.outputs.archive }}
          VERIFIED: ${{ steps.backup.outputs.verified }}
          ENCRYPTED: ${{ steps.backup.outputs.encrypted }}
        run: |
          for path in "$BACKUP_DIR" "$ARCHIVE" "$VERIFIED" "$ENCRYPTED"; do
            if [[ -n "$path" && "$path" == "$RUNNER_TEMP"/supabase-backup-* ]]; then
              rm -rf -- "$path"
            fi
          done
