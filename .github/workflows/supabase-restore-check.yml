name: Isolated Supabase restore check

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful main-branch encrypted backup run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-restore-check
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Download verified backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" > "$RUNNER_TEMP/restore-run.json"
          jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/supabase-backup.yml"' "$RUNNER_TEMP/restore-run.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts" > "$RUNNER_TEMP/restore-artifacts.json"
          artifact="$(jq -er '[.artifacts[] | select(.expired == false and (.name | test("^supabase-backup-[0-9]{8}T[0-9]{6}Z$")))] | if length == 1 then .[0].name else error("Expected exactly one backup") end' "$RUNNER_TEMP/restore-artifacts.json")"
          gh run download "$BACKUP_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$RUNNER_TEMP/restore-download"
          printf '## Isolated restore drill\n\nBackup: https://github.com/%s/actions/runs/%s\n\nNo production database credentials are provided to this job.\n' "$GITHUB_REPOSITORY" "$BACKUP_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Decrypt saved backup
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          files=("$RUNNER_TEMP"/restore-download/*.tar.gz.gpg)
          [[ ${#files[@]} == 1 && -f "${files[0]}" ]]
          export GNUPGHOME="$RUNNER_TEMP/restore-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 --output "$RUNNER_TEMP/restore.tar.gz" --decrypt "${files[0]}"
          tar -tzf "$RUNNER_TEMP/restore.tar.gz" > "$RUNNER_TEMP/restore-members.txt"
          ! grep -Ev '^\./(roles\.sql|schema\.sql|data\.sql|manifest\.json)?$' "$RUNNER_TEMP/restore-members.txt"
          for file in roles.sql schema.sql data.sql manifest.json; do grep -Fxq "./$file" "$RUNNER_TEMP/restore-members.txt"; done
          mkdir -m 700 "$RUNNER_TEMP/restore-dump"
          tar -xzf "$RUNNER_TEMP/restore.tar.gz" -C "$RUNNER_TEMP/restore-dump" --no-same-owner

      - name: Initialize temporary database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore-check"
          supabase init --workdir "$RUNNER_TEMP/restore-check" > "$RUNNER_TEMP/restore-init.log" 2>&1
          node scripts/restore-check.mjs configure "$RUNNER_TEMP/restore-dump/schema.sql" "$RUNNER_TEMP/restore-check/supabase/config.toml"
          if ! supabase db start --workdir "$RUNNER_TEMP/restore-check" > "$RUNNER_TEMP/restore-start.log" 2>&1; then
            echo 'Temporary database initialization failed; raw logs withheld.'
            exit 1
          fi

      - name: Isolate local database
        shell: bash
        run: |
          set -euo pipefail
          docker exec supabase_db_restore-check psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET cron.launch_active_jobs = 'off'" > /dev/null
          docker exec supabase_db_restore-check psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()" > /dev/null
          docker inspect supabase_db_restore-check --format '{{json .NetworkSettings.Networks}}' | jq -r 'keys[]' > "$RUNNER_TEMP/restore-networks.txt"
          while IFS= read -r network; do docker network disconnect "$network" supabase_db_restore-check; done < "$RUNNER_TEMP/restore-networks.txt"
          test "$(docker exec supabase_db_restore-check psql -U postgres -d postgres -Atc 'SHOW cron.launch_active_jobs')" = off

      - name: Restore and verify backup
        run: node scripts/restore-check.mjs verify "$RUNNER_TEMP/restore-dump"

      - name: Remove temporary data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          if docker inspect supabase_db_restore-check > /dev/null 2>&1; then
            docker rm -f -v supabase_db_restore-check > /dev/null || cleanup_failed=1
          fi
          if docker volume inspect supabase_db_restore-check > /dev/null 2>&1; then
            docker volume rm supabase_db_restore-check > /dev/null || cleanup_failed=1
          fi
          if [[ -d "$RUNNER_TEMP/restore-gnupg" ]]; then
            gpgconf --homedir "$RUNNER_TEMP/restore-gnupg" --kill gpg-agent || cleanup_failed=1
          fi
          for path in "$RUNNER_TEMP"/restore-* "$RUNNER_TEMP/restore.tar.gz"; do
            if [[ -e "$path" ]]; then rm -rf -- "$path" || cleanup_failed=1; fi
          done
          if [[ "$cleanup_failed" != 0 ]]; then
            echo 'Cleanup was not fully confirmed. Disposable runner teardown is still required.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Temporary database, volume and decrypted files removed. No plaintext artifacts were uploaded.' >> "$GITHUB_STEP_SUMMARY"
