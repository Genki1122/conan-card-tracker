<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONAN CARD Tracker</title>
    <meta name="theme-color" content="#1d1b24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="コナン対戦記録" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-shell">
      <header class="top-bar">
        <button id="backButton" class="icon-button" type="button" aria-label="戻る">‹</button>
        <div class="title-stack">
          <h1 id="screenTitle">デッキ</h1>
          <span id="syncStatus" aria-live="polite">端末保存</span>
        </div>
        <button id="moreButton" class="icon-button" type="button" aria-label="メニュー">⋯</button>
      </header>

      <section id="appView" class="screen"></section>

      <button id="fabButton" class="fab" type="button" aria-label="追加">＋</button>

      <aside id="updateBanner" class="update-banner" aria-live="polite" hidden>
        <span>新しいバージョンがあります</span>
        <button id="applyUpdateButton" type="button">更新</button>
      </aside>

      <nav class="bottom-nav" aria-label="メイン">
        <button class="nav-button active" type="button" data-nav="decks">
          <span>⌂</span>
          <small>デッキ</small>
        </button>
        <button class="nav-button" type="button" data-nav="summary">
          <span>◉</span>
          <small>分析</small>
        </button>
        <button class="nav-button" type="button" data-nav="players">
          <span>⌕</span>
          <small>プレイヤー</small>
        </button>
        <button class="nav-button" type="button" data-nav="sessions">
          <span>▣</span>
          <small>大会</small>
        </button>
      </nav>
    </main>

    <dialog id="entryDialog" class="sheet">
      <form id="entryForm" method="dialog">
        <div class="sheet-head">
          <div>
            <p id="dialogKicker">追加</p>
            <h2 id="dialogTitle">登録</h2>
          </div>
          <button value="cancel" class="icon-button" type="submit" formnovalidate>×</button>
        </div>
        <div id="dialogFields" class="sheet-fields"></div>
        <button id="dialogSubmit" class="primary-button" value="default" type="submit">保存</button>
      </form>
      <div id="caseCardDialog" class="case-card-overlay" role="dialog" aria-modal="true" aria-labelledby="caseCardDialogTitle" hidden>
        <button class="case-card-backdrop" type="button" data-close-case-card-picker aria-label="事件カード選択を閉じる"></button>
        <section class="case-card-dialog">
          <div class="case-card-dialog-inner">
            <header class="case-card-dialog-head">
              <h2 id="caseCardDialogTitle">事件カード <span id="caseCardDialogKicker">未選択</span></h2>
              <div class="case-card-dialog-actions">
                <button id="caseCardClear" class="case-card-clear" type="button" hidden>選択解除</button>
                <button id="caseCardDialogClose" class="icon-button" type="button" aria-label="閉じる">×</button>
              </div>
            </header>
            <label class="case-card-search-label"><span>候補を検索</span>
              <input id="caseCardSearch" type="search" placeholder="カード名で検索" autocomplete="off">
            </label>
            <div id="caseCardOptions" class="case-card-options" role="listbox" aria-label="事件カード候補"></div>
          </div>
        </section>
      </div>
    </dialog>

    <datalist id="opponentDeckSuggestions"></datalist>
    <datalist id="playerSuggestions"></datalist>
    <datalist id="sessionNameSuggestions"></datalist>
    <datalist id="environmentSuggestions"></datalist>

    <script type="module" src="./src/app.js?v=47"></script>
  </body>
</html>
