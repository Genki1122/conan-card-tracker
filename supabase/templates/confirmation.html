<!doctype html>
<html lang="ja">
  <body style="margin:0;background:#f4f2f7;font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',Meiryo,sans-serif;color:#211d29">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 14px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:28px">
          <tr><td>
            <p style="margin:0 0 8px;color:#6d4dd7;font-weight:700">CONAN CARD Tracker</p>
            <h1 style="margin:0 0 16px;font-size:22px">ユーザー登録用コード</h1>
            <p style="margin:0 0 14px;line-height:1.7">CONAN CARD Trackerの登録画面へ、次の認証コードを省略せず入力してください。</p>
            <p style="margin:0 0 18px;padding:16px;border-radius:8px;background:#f0ebff;color:#4d2faa;text-align:center;font-size:30px;font-weight:800">{{ .Token }}</p>
            <p style="margin:0 0 22px;color:#6d6673;font-size:13px;line-height:1.7">iPhoneのホーム画面アプリへ戻って入力すると、そのアプリ内でログインが完了します。</p>
            <p style="margin:0 0 22px"><a href="{{ .ConfirmationURL }}" style="color:#6d4dd7;font-size:13px;font-weight:700">Safariで登録を続ける場合はこちら</a></p>
            <p style="margin:0;color:#6d6673;font-size:13px;line-height:1.7">このメールに心当たりがない場合は、何もせず削除してください。</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
